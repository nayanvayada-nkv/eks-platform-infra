{{- /*
Kyverno: admission policies (image signatures, registries, digests, resources).
Its admission controller gets AWS access through Pod Identity (environments/dev/eks/kyverno-identity.tf)
to read signatures from ECR and the Cosign public key from KMS.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: {{ .Values.versions.kyverno | quote }}
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          replicas: 1 # dev; 3 in prod (with failurePolicy Fail, Kyverno down = no new pods)
          container:
            extraEnvVars:
              - name: AWS_REGION # Pod Identity does not set a region; KMS and ECR need one
                value: {{ .Values.awsRegion | quote }}
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Kyverno CRDs are too big for client-side apply
