apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after the policies and the mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # deleting the app deletes what it deployed
spec:
  project: default
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/workloads/backend/overlays/dev
    {{- with .Values.backendConfig }}
    kustomize:
      patches:
        # Real Aurora / Valkey endpoints from Terraform; Git keeps placeholders.
        - target:
            kind: ConfigMap
            name: backend-config
          patch: |-
            - op: replace
              path: /data
              value: {{ toJson . }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
