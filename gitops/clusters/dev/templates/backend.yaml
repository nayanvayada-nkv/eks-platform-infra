apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after the policies and the mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # deleting the app deletes what it deployed
spec:
  project: default
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    {{- $dr := ne .Values.awsRegion .Values.homeRegion }}
    path: gitops/workloads/backend/overlays/{{ if $dr }}dr{{ else }}dev{{ end }}
    {{- if or $dr .Values.backendConfig }}
    kustomize:
      {{- if $dr }}
      images:
        # Same digest, image pulled from this region's ECR replica (signatures replicate too).
        - "{{ .Values.awsAccountId }}.dkr.ecr.{{ .Values.homeRegion }}.amazonaws.com/eks-platform/backend={{ .Values.awsAccountId }}.dkr.ecr.{{ .Values.awsRegion }}.amazonaws.com/eks-platform/backend"
      {{- end }}
      {{- with .Values.backendConfig }}
      patches:
        # Real Aurora / Valkey endpoints from Terraform; Git keeps placeholders.
        - target:
            kind: ConfigMap
            name: backend-config
          patch: |-
            - op: replace
              path: /data
              value: {{ toJson . }}
      {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
    # In the DR region the db-migrate hook fails while Aurora there is still a read-only
    # secondary; once the drill promotes it, a retry succeeds and the API comes up.
    retry:
      limit: 30
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
