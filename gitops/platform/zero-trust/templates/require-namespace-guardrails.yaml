# New namespaces must opt in to Pod Security "restricted" and to the ambient mesh.
# Without this, anyone who can create a namespace could create a privileged, unmeshed one.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-namespace-guardrails
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions: {{ toJson .Values.validationActions }}
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
    objectSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.systemNamespaces | nindent 12 }}
  variables:
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
  validations:
    - expression: "variables.labels[?'pod-security.kubernetes.io/enforce'].orValue('') == 'restricted'"
      message: "namespace needs label pod-security.kubernetes.io/enforce=restricted"
    - expression: "variables.labels[?'istio.io/dataplane-mode'].orValue('') == 'ambient'"
      message: "namespace needs label istio.io/dataplane-mode=ambient (mTLS through ztunnel)"
