{{- range .Values.allowedCidrs }}
{{- if eq . "0.0.0.0/0" }}{{ fail "allowedCidrs must not contain 0.0.0.0/0 (dev ALB is for your IP only; WAF + CloudFront come in Phase 5)" }}{{ end }}
{{- end }}
# The AWS Load Balancer Controller turns this into an internet-facing ALB that sends traffic
# straight to the gateway pod IPs. Only the listed CIDRs may connect (ALB security group).
# HTTP only for now: TLS with ACM, Route 53, CloudFront and WAF are Phase 5.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," .Values.allowedCidrs | quote }}
    alb.ingress.kubernetes.io/healthcheck-port: "15021" # gateway readiness port
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    # Drop malformed headers (request smuggling defence) and hide the ALB's version details.
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true,routing.http.desync_mitigation_mode=strictest
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingress
                port:
                  number: 80
