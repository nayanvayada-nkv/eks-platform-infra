apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext: # passes Pod Security "restricted"
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: backend # replaced by the overlay with ECR image@sha256 digest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics # Prometheus only (AuthorizationPolicy); not in the Service
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # Traces -> ADOT collector (monitoring namespace) -> AWS X-Ray. 25% of new traces sampled.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: backend
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Ready only when Aurora and Valkey answer; liveness stays on /healthz so a
          # database outage removes pods from the Service instead of restarting them.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            timeoutSeconds: 12 # first query may wake Aurora from 0 ACU
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
