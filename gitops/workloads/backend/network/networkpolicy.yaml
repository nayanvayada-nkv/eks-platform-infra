# Layer 3/4 firewall, enforced by the VPC CNI network policy agent (eBPF on each node).
# Default deny in both directions, then allow only what the backend needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {} # every pod in the namespace
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    # Mesh traffic arrives as HBONE (mTLS tunnel) on 15008, from the Istio ingress
    # gateway (Phase 4/5) or other backend pods. Nothing else in the cluster may connect.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
        - podSelector: {} # same namespace
      ports:
        - { protocol: TCP, port: 15008 }
    # Prometheus (monitoring namespace, meshed) scrapes port 9464 over HBONE.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 15008 }
    # Kubelet health probes: in ambient mode istio-cni rewrites their source to this
    # link-local address so ztunnel lets them through in plaintext.
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
spec:
  # The API pods and the db-migrate Job.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [backend, backend-migrate]
  policyTypes: [Egress]
  egress:
    # DNS, to CoreDNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Traces to the ADOT collector (monitoring namespace, meshed): HBONE on 15008.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 15008 }
    # EKS Pod Identity agent (link-local on every node): where the pod gets its IAM credentials.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - { protocol: TCP, port: 80 }
    # Aurora and Valkey live in the VPC's private subnets (10.20.0.0/16, environments/dev/network).
    # Their security groups only accept the cluster, so both sides must agree.
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    # Secrets Manager (db-migrate) through the VPC interface endpoint (private DNS), never the internet.
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
