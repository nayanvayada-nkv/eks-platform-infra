name: terraform-checks

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.hcl"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (every stack and module)
        run: |
          for d in bootstrap modules/* environments/*/*; do
            [ -n "$(ls "$d"/*.tf 2>/dev/null)" ] || continue
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false # all findings fixed or skipped with a written reason (Phase 8)

  # Phase 1: add a `plan` job here that assumes vars.AWS_PLAN_ROLE_ARN via OIDC
  # (permissions: id-token: write) and runs terraform plan per changed stack.
